server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API (Express) — mesma origem do site, então o cookie de login funciona
    # Usa variável e resolver DNS interno do Docker para o Nginx não quebrar se a API estiver desligada
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_server http://server:3333;
        proxy_pass $upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Arquivos com hash do Vite: cache longo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
