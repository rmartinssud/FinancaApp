server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API (Express) — mesma origem do site, então o cookie de login funciona
    # Usa variável e resolver DNS interno do Docker para o Nginx não quebrar se a API estiver desligada
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_server http://server:3333;
        proxy_pass $upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        # Anexos (foto/PDF): a API recebe até 15 MB e grava no máximo 3 MB; o padrão do Nginx é 1 MB.
        # Materiais da Educação financeira (PDF, planilhas): até 20 MB
        client_max_body_size 21m;
    }

    # SEO: sitemap e robots montados pela API (incluem os conteúdos públicos da Educação financeira)
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s;
        set $upstream_server http://server:3333;
        proxy_pass $upstream_server/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        resolver 127.0.0.11 valid=30s;
        set $upstream_server http://server:3333;
        proxy_pass $upstream_server/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Educação financeira (/educacao e /educacao/...): o mesmo app React, mas com título, descrição e
    # Open Graph da página já no HTML (Google e prévia do WhatsApp sem JavaScript).
    # educacao-ssi.html = index.html com um include SSI de /api/seo/head (scripts/gerar-html-seo.mjs).
    # Se a API não responder, o include usa as tags padrão do site.
    location ~ ^/educacao(/|$) {
        ssi on;
        set $seo_uri $request_uri;
        rewrite ^ /educacao-ssi.html break;
        add_header Cache-Control "no-cache";
    }
    location = /educacao-ssi.html {
        return 404;
    }

    # Arquivos com hash do Vite: cache longo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
